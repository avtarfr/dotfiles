[general]
step = 2
step-big = 10

[keys]
up        = k, KEY_UP
down      = j, KEY_DOWN
left      = h, KEY_LEFT
right     = l, KEY_RIGHT
left-big  = H, KEY_SLEFT
right-big = L, KEY_SRIGHT
top       = g, KEY_HOME
bottom    = G, KEY_END
mode1     = 1, KEY_F1
mode2     = 2, KEY_F2
mode3     = 3, KEY_F3
next-mode = KEY_TAB
prev-mode = KEY_BTAB
mute      = m
lock      = ' '
quit      = q, KEY_ESC

[ui]
hide-unavailable-profiles = yes
hide-unavailable-ports = yes
color = 2
mouse = yes

[style]
bar-top-left       = ┌
bar-left-mono      = ╶
bar-top-right      = ┐
bar-right-mono     = ╴
bar-bottom-left    = └
bar-bottom-right   = ┘
bar-on             = █
bar-on-muted       = ▒
bar-off            = ░
arrow              = ' '
arrow-focused      = ─
arrow-locked       = ─
default-stream     = ●
info-locked        = L
info-unlocked      = U
info-muted         = M
info-unmuted       = V

[renames]
'(?i)Ryzen HD Audio Controller Analog Stereo' = 'Built-in Audio'
'(?i)PipeWire ALSA \[spotify_player\]'        = 'Spotify'
'(?i)AudioIPC Server'                         = 'Browser Audio'